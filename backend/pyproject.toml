[project]
name = "back"
version = "0.1.0"
description = "Verilog Classroom Backend API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.0.0",
    "docker>=7.0.0",
    "python-multipart>=0.0.18",
    "vcdvcd>=2.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires Docker and a running Yosys container",
]
pythonpath = ["."]
testpaths = ["tests"]
addopts = '-m "not integration"'

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]
ignore = ["E501"]  # comprimento de linha fica a cargo do ruff format
