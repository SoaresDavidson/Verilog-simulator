# Restrições aplicadas aos containers que executam código Verilog enviado por
# alunos (#7). Os valores podem ser sobrescritos por variáveis no .env da raiz.
# Ver docs/seguranca/modelo-de-isolamento.md.
x-execution-hardening: &execution-hardening
  init: true                      # PID 1 (tini) recolhe processos órfãos após timeout
  mem_limit: ${EXECUTION_MEM_LIMIT:-512m}
  memswap_limit: ${EXECUTION_MEM_LIMIT:-512m}   # igual a mem_limit = sem swap extra
  cpus: ${EXECUTION_CPUS:-1.0}
  pids_limit: ${EXECUTION_PIDS_LIMIT:-256}
  network_mode: none
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  working_dir: /verilog_code
  volumes:
    - ./verilog_code:/verilog_code
    - ./scripts:/scripts:ro
  stdin_open: true
  tty: true

services:
  # Além de servir o modo EXECUTION_MODE=exec, estes serviços constroem e
  # nomeiam as imagens usadas pelos containers efêmeros (modo padrão).
  icarus:
    <<: *execution-hardening
    image: ${ICARUS_IMAGE:-verilog-classroom/icarus:latest}
    build:
      context: .
      dockerfile: icarus.dockerfile
      args:
        UID: ${EXECUTION_UID:-1000}
        GID: ${EXECUTION_GID:-1000}
    container_name: icarus-verilog

  yosys:
    <<: *execution-hardening
    image: ${YOSYS_IMAGE:-verilog-classroom/yosys:latest}
    build:
      context: .
      dockerfile: yosys.dockerfile
      args:
        UID: ${EXECUTION_UID:-1000}
        GID: ${EXECUTION_GID:-1000}
    container_name: yosys

  react-vite:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react-vite
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - react_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-back
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./verilog_code:/verilog_code
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      # Dono entregue a cada run antes da execução; igual ao usuário das imagens.
      - EXECUTION_UID=${EXECUTION_UID:-1000}
      - EXECUTION_GID=${EXECUTION_GID:-1000}
      - EXECUTION_MODE=${EXECUTION_MODE:-ephemeral}
      - YOSYS_IMAGE=${YOSYS_IMAGE:-verilog-classroom/yosys:latest}
      - ICARUS_IMAGE=${ICARUS_IMAGE:-verilog-classroom/icarus:latest}
      - EXECUTION_MEM_LIMIT=${EXECUTION_MEM_LIMIT:-512m}
      - EXECUTION_CPUS=${EXECUTION_CPUS:-1.0}
      - EXECUTION_PIDS_LIMIT=${EXECUTION_PIDS_LIMIT:-256}
      # O daemon resolve os bind mounts dos containers efêmeros no HOST: estes
      # são os caminhos no host de ./verilog_code e ./scripts. ${PWD} vale quando
      # o compose é chamado da raiz do repositório; senão, defina-os no .env da raiz.
      - HOST_VERILOG_ROOT=${HOST_VERILOG_ROOT:-${PWD}/verilog_code}
      - HOST_SCRIPTS_DIR=${HOST_SCRIPTS_DIR:-${PWD}/scripts}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          url = "http://localhost:8000/api/v1/status/live"
          sys.exit(0 if urllib.request.urlopen(url, timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  react_node_modules:
