services:
  icarus:
    build:
      context: .
      dockerfile: icarus.dockerfile
    container_name: icarus-verilog
    working_dir: /verilog_code
    volumes:
      - ./verilog_code:/verilog_code
      - ./scripts:/scripts
    stdin_open: true
    tty: true

  yosys:
    build:
      context: .
      dockerfile: yosys.dockerfile
    container_name: yosys
    working_dir: /verilog_code
    volumes:
      - ./verilog_code:/verilog_code
      - ./scripts:/scripts
    stdin_open: true
    tty: true

  react-vite:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react-vite
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - react_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi-back
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./verilog_code:/verilog_code
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts
    environment:
      - PYTHONUNBUFFERED=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          url = "http://localhost:8000/api/v1/status/live"
          sys.exit(0 if urllib.request.urlopen(url, timeout=3).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  react_node_modules:
